<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0e2246" />
      <stop offset="55%" stop-color="#071126" />
      <stop offset="100%" stop-color="#030813" />
    </radialGradient>
    <linearGradient id="rack-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="dark-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="visor-gold" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="78%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <radialGradient id="coral-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mist-cone" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Studio Deep Cosmic Navy Environment -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />

  <!-- Ambient Volumetric Rim Glows -->
  <circle cx="380" cy="240" r="320" fill="url(#coral-glow)" />
  <circle cx="820" cy="360" r="340" fill="url(#cyan-glow)" />

  <!-- Reflective Studio Floor -->
  <ellipse cx="640" cy="650" rx="560" ry="55" fill="#0c2348" opacity="0.55" />
  <line x1="120" y1="620" x2="1160" y2="620" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />

  <!-- LEFT / CENTER: ISS Spacecraft Cabin Safety Cutaway Frame -->
  <g transform="translate(130, 85)">
    <!-- Outer Module Shell -->
    <rect x="0" y="0" width="660" height="510" rx="36" fill="url(#dark-panel)" stroke="#475569" stroke-width="6" />
    <rect x="20" y="20" width="620" height="470" rx="26" fill="#09152b" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />

    <!-- Top Ventilation Return Duct & SAME Laser Smoke Detector -->
    <rect x="70" y="36" width="520" height="68" rx="18" fill="url(#rack-metal)" />
    <rect x="95" y="50" width="210" height="40" rx="10" fill="#0f172a" />
    <!-- Ventilation Louvers -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="115" y1="60" x2="115" y2="80" />
      <line x1="135" y1="60" x2="135" y2="80" />
      <line x1="155" y1="60" x2="155" y2="80" />
      <line x1="175" y1="60" x2="175" y2="80" />
      <line x1="195" y1="60" x2="195" y2="80" />
    </g>

    <!-- Laser Optical Smoke Sensor Unit (SAME) -->
    <circle cx="420" cy="70" r="26" fill="#0f172a" stroke="#f43f5e" stroke-width="4" />
    <circle cx="420" cy="70" r="11" fill="#fb7185" />

    <!-- Scanning Laser Beams Detecting Microgravity Smoke Aggregates -->
    <g opacity="0.85">
      <polygon points="420,82 210,370 265,390" fill="url(#coral-glow)" />
      <line x1="420" y1="82" x2="235" y2="380" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 6" />
      <line x1="420" y1="82" x2="355" y2="400" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 6" />
      <line x1="420" y1="82" x2="495" y2="375" stroke="#fda4af" stroke-width="2.5" stroke-dasharray="8 6" />
    </g>

    <!-- Contained Chamber Test Cell + Inert CO2 / Water Mist Suppression Nozzle -->
    <g transform="translate(175, 195)">
      <rect x="0" y="0" width="310" height="235" rx="28" fill="#050d1e" stroke="#64748b" stroke-width="5" />
      <rect x="14" y="14" width="282" height="207" rx="20" fill="#07142c" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" />

      <!-- Suppression Nozzle on Left Wall -->
      <rect x="14" y="88" width="44" height="32" rx="8" fill="url(#rack-metal)" />
      <polygon points="58,92 78,84 78,124 58,116" fill="#38bdf8" />

      <!-- Cooling CO2 / Mist Plume Suppressing the Flame -->
      <polygon points="78,104 235,45 255,175" fill="url(#mist-cone)" />

      <!-- Diminished, Safely Contained Microgravity Sphere -->
      <circle cx="195" cy="112" r="46" fill="#38bdf8" opacity="0.22" />
      <circle cx="195" cy="112" r="32" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />
      <circle cx="195" cy="112" r="18" fill="#fb923c" opacity="0.85" />
      <circle cx="195" cy="112" r="9" fill="#fef08a" />

      <!-- Floating Smoke Particle Aggregates Detected by Laser -->
      <circle cx="155" cy="70" r="4.5" fill="#fda4af" />
      <circle cx="163" cy="68" r="3.5" fill="#fda4af" />
      <circle cx="225" cy="64" r="4" fill="#38bdf8" />
      <circle cx="242" cy="145" r="4" fill="#67e8f9" />
    </g>

    <!-- Status Telemetry Dials on Rack -->
    <circle cx="95" cy="240" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <path d="M80 245 A 18 18 0 0 1 110 235" stroke="#4ade80" stroke-width="4" fill="none" />
    <circle cx="95" cy="320" r="28" fill="#0f172a" stroke="#f43f5e" stroke-width="3" />
    <circle cx="95" cy="320" r="10" fill="#fb7185" />
  </g>

  <!-- RIGHT: 3D Stylized Astronaut Safety Engineer with Golden Visor -->
  <g transform="translate(880, 175)">
    <!-- Shadow on floor -->
    <ellipse cx="95" cy="435" rx="95" ry="22" fill="#020617" opacity="0.7" />

    <!-- Backpack PLSS Life Support -->
    <rect x="115" y="135" width="78" height="145" rx="22" fill="url(#rack-metal)" stroke="#475569" stroke-width="3" />
    <circle cx="168" cy="172" r="8" fill="#38bdf8" />
    <circle cx="168" cy="198" r="8" fill="#f97316" />

    <!-- Legs & Boots -->
    <rect x="48" y="305" width="42" height="98" rx="18" fill="url(#rack-metal)" />
    <rect x="102" y="305" width="42" height="98" rx="18" fill="url(#rack-metal)" />
    <rect x="42" y="338" width="48" height="10" rx="4" fill="#f97316" />
    <rect x="98" y="338" width="48" height="10" rx="4" fill="#f97316" />
    <ellipse cx="66" cy="405" rx="28" ry="16" fill="#e2e8f0" stroke="#0284c7" stroke-width="4" />
    <ellipse cx="122" cy="405" rx="28" ry="16" fill="#e2e8f0" stroke="#0284c7" stroke-width="4" />

    <!-- Torso Spacesuit -->
    <rect x="36" y="150" width="118" height="168" rx="44" fill="url(#rack-metal)" stroke="#94a3b8" stroke-width="3" />
    <!-- Chest Telemetry Control Module -->
    <rect x="56" y="185" width="74" height="54" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="76" cy="206" r="7" fill="#4ade80" />
    <circle cx="98" cy="206" r="7" fill="#fde047" />
    <rect x="70" y="222" width="44" height="6" rx="3" fill="#38bdf8" />

    <!-- Left Arm Holding Tablet -->
    <rect x="4" y="175" width="42" height="96" rx="20" fill="url(#rack-metal)" transform="rotate(14 25 220)" />
    <!-- Diagnostic Tablet -->
    <rect x="-28" y="232" width="76" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3" transform="rotate(-12 10 255)" />

    <!-- 3D Bubble Helmet with Reflective Golden-Amber Visor -->
    <circle cx="95" cy="85" r="78" fill="url(#rack-metal)" stroke="#cbd5e1" stroke-width="4" />
    <ellipse cx="86" cy="86" rx="60" ry="54" fill="url(#visor-gold)" stroke="#fde047" stroke-width="2.5" />
    <!-- Visor Specular Highlights Reflecting the Chamber -->
    <ellipse cx="64" cy="62" rx="22" ry="12" fill="#ffffff" opacity="0.55" transform="rotate(-22 64 62)" />
    <circle cx="76" cy="92" r="14" fill="#fde047" opacity="0.65" />
    <circle cx="156" cy="86" r="16" fill="#0284c7" stroke="#e2e8f0" stroke-width="4" />
  </g>
</svg>

